name: Hide Outdated Reviews

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hide Previous DeepSeek Reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;

            // 拉取该 PR 的所有评论（分页处理）
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            // 找出机器人发的、含 "DeepSeek 代码审查" 的评论
            const botComments = comments.filter(c => {
              const isBot = c.user.type === 'Bot' || c.user.login.includes('[bot]');
              return isBot && c.body && c.body.includes('DeepSeek 代码审查');
            });

            // 按创建时间倒序，保留最新一条，只隐藏其他的
            botComments.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );

            const toHide = botComments.slice(1);

            console.log(`共找到 ${botComments.length} 条机器人审查评论，将隐藏 ${toHide.length} 条（保留最新一条）`);

            for (const comment of toHide) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                      minimizedComment {
                        isMinimized
                      }
                    }
                  }
                `, { id: comment.node_id });
                console.log(`已隐藏评论 ${comment.id} (${comment.created_at})`);
              } catch (e) {
                console.log(`隐藏评论 ${comment.id} 失败: ${e.message}`);
              }
            }