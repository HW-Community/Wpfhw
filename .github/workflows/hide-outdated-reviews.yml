name: Hide Outdated Reviews

on:
  workflow_run:
    workflows: ["PR Review and Label"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  hide:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hide Previous DeepSeek Reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // workflow_run 事件里，PR 号要从关联的 pull_requests 里取
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('没有关联的 PR，退出');
              return;
            }
            const prNumber = prs[0].number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            );

            const botComments = comments.filter(c => {
              const isBot = c.user.type === 'Bot' || c.user.login.includes('[bot]');
              return isBot && c.body && c.body.includes('DeepSeek 代码审查');
            });

            // 按创建时间倒序，保留最新一条
            botComments.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );
            const toHide = botComments.slice(1);

            console.log(`共 ${botComments.length} 条，隐藏 ${toHide.length} 条`);

            for (const comment of toHide) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                      minimizedComment { isMinimized }
                    }
                  }
                `, { id: comment.node_id });
                console.log(`已隐藏评论 ${comment.id}`);
              } catch (e) {
                console.log(`隐藏失败 ${comment.id}: ${e.message}`);
              }
            }