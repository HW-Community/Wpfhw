name: PR Review and Label

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Add "未验证" Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['未验证']
            });

      - name: DeepSeek Code Review
        uses: LittleY98/ai-code-review@v1.0.0
        with:
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          API_BASE_URL: ${{ vars.DEEPSEEK_API_BASE_URL || 'https://api.deepseek.com/v1' }}
          MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          SYSTEM_PROMPT: |
            你是一位资深代码审查员。请审查本次 PR 的代码变更，指出：
            1. 潜在的 Bug 和逻辑错误
            2. 代码质量问题
            3. 安全风险
            4. 改进建议
            请用中文回复，使用 Markdown 格式。
          REVIEWER_NAME: 'Wpfhw Bot'