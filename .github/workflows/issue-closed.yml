name: Issue Closed Label Handler

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  handle-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Save and Clean Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumber = context.payload.issue.number;
            const currentLabels = context.payload.issue.labels.map(l => l.name);

            // 保存当前标签到 Issue 的 body 中（用于 Reopen 时恢复）
            const issue = context.payload.issue;
            const marker = '<!-- LABEL_BACKUP -->';
            const backupRegex = new RegExp(`${marker}[\\s\\S]*?${marker}`, 'g');
            const backupData = `${marker}\n${JSON.stringify(currentLabels)}\n${marker}`;

            let newBody = issue.body || '';
            if (backupRegex.test(newBody)) {
              newBody = newBody.replace(backupRegex, backupData);
            } else {
              newBody = newBody + '\n\n' + backupData;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: newBody
            });

            // 移除所有标签
            await github.rest.issues.removeAllLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // ★ 新增：根据关闭原因决定最终标签 ★
            const stateReason = context.payload.issue.state_reason;
            let finalLabel = '拒绝'; // 默认

            if (stateReason === 'completed') {
              // 由 PR 合并自动关闭，或手动标记为"完成"
              finalLabel = '成功';
            } else if (stateReason === 'not_planned') {
              // 标记为"未计划"
              finalLabel = '拒绝';
            } else {
              // 手动关闭且未选原因 → 检查是否有"重复"相关标签
              const lower = currentLabels.map(s => s.toLowerCase());
              if (lower.some(s => s.includes('duplicate') || s.includes('重复'))) {
                finalLabel = '重复';
              }
            }

            // 添加最终标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [finalLabel]
            });