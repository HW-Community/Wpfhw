name: Issue Reopened Label Restore

on:
  issues:
    types: [reopened]

permissions:
  issues: write

jobs:
  restore-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Restore Labels from Backup
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumber = context.payload.issue.number;
            const body = context.payload.issue.body || '';
            const marker = '<!-- LABEL_BACKUP -->';
            const regex = new RegExp(`${marker}\\s*\\n(.*?)\\n\\s*${marker}`, 's');
            const match = body.match(regex);

            if (match) {
              const savedLabels = JSON.parse(match[1]);

              // 移除当前所有标签
              await github.rest.issues.removeAllLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              // 恢复保存的标签
              if (savedLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: savedLabels
                });
              }

              // 清理备份标记
              const newBody = body.replace(regex, '').trim();
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              });
            }