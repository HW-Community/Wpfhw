name: Issue‑Close‑Bot
on:
  issues:
    types:
      - closed
permissions:
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Modify issue labels
        run: |
          REASON=$(jq -r '.issue.state_reason' <<< "$(jq -c . '${{ toJson(github.event) }}')")
          if [[ "${REASON}" == "not_planned" ]]; then
            curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
            -d '{"labels":["拒绝"]}'
          elif [[ "${REASON}" == "duplicate" ]]; then
            curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
            -d '{"labels":["重复: ("]}'
          fi