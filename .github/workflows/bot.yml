name: Issue Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 查重并处理新 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          log() { echo "[$(date '+%H:%M:%S')] $*"; }

          # 确保所需标签存在（已存在则更新）
          for lbl in "未验证:FBCA04:待人工验证" "垃圾内容:D73C2E:垃圾/无效内容" "重复:5319E7:与其他开放issue重复"; do
            name="${lbl%%:*}"
            rest="${lbl#*:}"
            color="${rest%%:*}"
            desc="${rest#*:}"
            gh label create "$name" --color "$color" --description "$desc" --force >/dev/null 2>&1 || true
          done

          log "读取新 issue #${ISSUE_NUMBER}..."
          NEW_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title -q '.title' 2>/dev/null || echo "")
          NEW_BODY=$(gh issue view "$ISSUE_NUMBER" --json body -q '(.body // "")' 2>/dev/null || echo "")

          if [ -z "$NEW_TITLE" ]; then
            log "ERROR: 无法读取 issue 标题（可能是 API 竞态或权限问题），降级为未验证"
            gh issue edit "$ISSUE_NUMBER" --add-label "未验证" 2>/dev/null || true
            exit 0
          fi
          log "新 issue 标题: $NEW_TITLE"

          # 读取全部开放 issue
          log "读取开放 issue 列表..."
          ISSUES_JSON=$(gh issue list --state open --json number,title,body --limit 1000 2>/dev/null || echo "[]")

          if ! echo "$ISSUES_JSON" | jq -e '.' >/dev/null 2>&1; then
            log "WARN: issue 列表 JSON 解析失败，降级为仅新 issue 自身"
            ISSUES_JSON="[]"
          fi
          OTHER_COUNT=$(echo "$ISSUES_JSON" | jq --argjson n "$ISSUE_NUMBER" '[.[] | select(.number != $n)] | length')
          log "共读取到 ${OTHER_COUNT} 个其他开放 issue"

          # 组装 DeepSeek 请求体
          log "构造 AI 请求..."
          PAYLOAD=$(jq -n \
            --arg sys '你是一个 issue 分类助手。对比新 issue 与仓库中其他开放 issue，判断类型：normal=内容正常且不重复；duplicate=与某已有开放 issue 诉求重复（需在 origin_id 指明编号）；reject=垃圾/无效/测试/广告。只返回 JSON，格式：{"type":"normal|duplicate|reject","origin_id":编号或null}' \
            --arg new_title "$NEW_TITLE" \
            --arg new_body "$NEW_BODY" \
            --argjson new_num "$ISSUE_NUMBER" \
            --argjson issues "$ISSUES_JSON" \
            '{
              model: "deepseek-chat",
              messages: [
                {role: "system", content: $sys},
                {role: "user", content: (
                  "新 issue 编号: \($new_num)\n" +
                  "新 issue 标题: \($new_title)\n" +
                  "新 issue 内容: \($new_body)\n\n" +
                  "其他开放 issue 列表（已排除新 issue 自身）：\n" +
                  ([$issues[] | select(.number != $new_num)
                    | "  编号\(.number) | 标题: \(.title) | 内容: \(.body // "无内容")"]
                    | join("\n"))
                )}
              ],
              response_format: {type: "json_object"},
              stream: false
            }')

          # 调用 DeepSeek
          log "调用 DeepSeek API..."
          RESPONSE=$(curl -sS --max-time 90 -X POST https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>/dev/null || true)

          if [ -z "$RESPONSE" ]; then
            log "ERROR: curl 返回空响应，降级为未验证"
            gh issue edit "$ISSUE_NUMBER" --add-label "未验证" 2>/dev/null || true
            exit 0
          fi

          if ! echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            log "ERROR: API 返回异常，降级为未验证。响应片段: $(echo "$RESPONSE" | head -c 500)"
            gh issue edit "$ISSUE_NUMBER" --add-label "未验证" 2>/dev/null || true
            exit 0
          fi

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          TYPE=$(echo "$CONTENT" | jq -r '.type // "unknown"' 2>/dev/null || echo "unknown")
          ORIGIN_ID=$(echo "$CONTENT" | jq -r '.origin_id // ""' 2>/dev/null || echo "")

          log "AI 分类结果: type=$TYPE origin_id=$ORIGIN_ID"

          case "$TYPE" in
            normal)
              log "标记为 normal → 添加标签「未验证」"
              gh issue edit "$ISSUE_NUMBER" --add-label "未验证" 2>/dev/null || true
              ;;
            reject)
              log "标记为 reject → 添加标签「垃圾内容」并关闭"
              gh issue edit "$ISSUE_NUMBER" --add-label "垃圾内容" 2>/dev/null || true
              gh issue close "$ISSUE_NUMBER" 2>/dev/null || true
              ;;
            duplicate)
              log "标记为 duplicate → 添加标签「重复」、评论并关闭"
              gh issue edit "$ISSUE_NUMBER" --add-label "重复" 2>/dev/null || true
              if [ -n "$ORIGIN_ID" ] && [ "$ORIGIN_ID" != "null" ]; then
                gh issue comment "$ISSUE_NUMBER" --body "此issue与#${ORIGIN_ID}诉求重复，已关闭" 2>/dev/null || true
              else
                gh issue comment "$ISSUE_NUMBER" --body "此issue与其他开放issue诉求重复，已关闭" 2>/dev/null || true
              fi
              gh issue close "$ISSUE_NUMBER" 2>/dev/null || true
              ;;
            *)
              log "未知 type='$TYPE'，降级为未验证。原始返回: $CONTENT"
              gh issue edit "$ISSUE_NUMBER" --add-label "未验证" 2>/dev/null || true
              ;;
          esac

          log "处理完成"

  pr_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AI 生成 PR 简评
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          log() { echo "[$(date '+%H:%M:%S')] $*"; }

          log "读取 PR #${PR_NUMBER} 信息..."
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q '.title' 2>/dev/null || echo "")
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q '(.body // "")' 2>/dev/null || echo "")
          PR_DIFF=$(gh pr diff "$PR_NUMBER" 2>/dev/null || echo "")

          if [ -z "$PR_TITLE" ]; then
            log "ERROR: 无法读取 PR 标题，跳过"
            exit 0
          fi

          # 截断 diff，避免超出模型上下文
          PR_DIFF_TRUNCATED=$(printf '%s' "$PR_DIFF" | head -c 20000)

          log "构造 AI 请求..."
          PAYLOAD=$(jq -n \
            --arg sys "你是一位资深代码审查者。请基于 PR 标题、描述和 diff，生成一条简短专业的 Markdown 评论，包含改动要点总结与一两条改进建议。总字数严格不超过 250 字，直接输出 Markdown 正文，不要加标题、不要输出 JSON、不要任何解释。" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg diff "$PR_DIFF_TRUNCATED" \
            '{
              model: "deepseek-chat",
              messages: [
                {role: "system", content: $sys},
                {role: "user", content: ("PR 标题: \($title)\nPR 描述: \($body)\n\nDiff:\n\($diff)")}
              ],
              stream: false
            }')

          log "调用 DeepSeek API..."
          RESPONSE=$(curl -sS --max-time 90 -X POST https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>/dev/null || true)

          if [ -z "$RESPONSE" ]; then
            log "ERROR: curl 返回空响应，跳过"
            exit 0
          fi

          if ! echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            log "ERROR: API 返回异常，跳过。响应片段: $(echo "$RESPONSE" | head -c 500)"
            exit 0
          fi

          COMMENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          log "发表 PR 评论"
          gh pr comment "$PR_NUMBER" --body "$COMMENT" 2>/dev/null || true

          log "处理完成"
