name: Issue Auto Moderation
on:
  issues:
    types: [opened]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Get issue info
        run: |
          echo "TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "BODY=${{ github.event.issue.body }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Fetch recent issues (REST‑API, no gh cli)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" > filtered_issues.json

      - name: Call DeepSeek AI judge
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          ISSUE_TITLE="$TITLE"
          ISSUE_BODY="$BODY"
          ISSUE_NUM=${{ github.event.issue.number }}
          ISSUES_JSON=$(cat filtered_issues.json)

          RESPONSE=$(curl -s -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -d '{
              "model": "deepseek-chat",
              "temperature": 0.0,
              "response_format": {"type": "json_object"},
              "messages": [
                {
                  "role": "system",
                  "content": "你是严格的Issue重复审核机器人，只输出标准JSON，禁止任何多余文字、markdown、解释。判定规则：1.只要标题和正文的核心功能诉求完全一致，仅仅是措辞、语序、长短不同，一律判定duplicate；例如“Esc返回上一级”和“增加Esc返回上一个页面”属于完全重复；2.乱码、无意义灌水判定为reject；3.只有全新的、和所有历史Issue诉求都不同的内容才判定为normal。【铁律】如果你输出type:\"duplicate\"，origin_id绝不允许为null，必须从提供的历史Issue列表里挑选最匹配条目的number字段填入；若列表无匹配项，禁止判定duplicate，只能返回normal，origin_id=null。严禁返回当前待审核issue的编号。输出格式：{\"type\":\"reject|duplicate|normal\",\"origin_id\":number|null}"
                },
                {
                  "role": "user",
                  "content": "当前Issue编号：'"$ISSUE_NUM"'，标题：'"$ISSUE_TITLE"'，正文：'"$ISSUE_BODY"'，历史Issue列表：'"$ISSUES_JSON"'"
                }
              ]
            }')

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > result.json
          sed -i 's/```json//g;s/```//g' result.json
          cat result.json

          AI_TYPE=$(jq -r '.type' result.json || echo "normal")
          ORIGIN_ID=$(jq -r '.origin_id' result.json || echo "null")

          # 兜底：duplicate却无编号 → 降级normal
          if [[ "$AI_TYPE" == "duplicate" && "$ORIGIN_ID" == "null" ]]; then
            AI_TYPE="normal"
          fi

          echo "AI_TYPE=$AI_TYPE" >> $GITHUB_ENV
          echo "ORIGIN_ID=$ORIGIN_ID" >> $GITHUB_ENV

      - name: Handle normal issue
        if: env.AI_TYPE == 'normal'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              labels: ["未验证"]
            })

      - name: Handle reject issue
        if: env.AI_TYPE == 'reject'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              labels: ["垃圾内容"]
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              state: 'closed'
            })

      - name: Handle duplicate issue
        if: env.AI_TYPE == 'duplicate'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              labels: ["重复"]
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              body: `此issue与#${{ env.ORIGIN_ID }}诉求重复，已关闭`
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.ISSUE_NUMBER }},
              state: 'closed'
            })
