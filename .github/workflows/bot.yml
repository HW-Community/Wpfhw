name: Issue Auto Moderation
on:
  issues:
    types: [opened]

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Get issue info
        id: issue
        run: |
          echo "TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "BODY=${{ github.event.issue.body }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV

      - name: Fetch recent issues
        id: fetch_issues
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues?state=all&per_page=100 > issues.json
          
          # 【关键修复】删掉当前新建的issue，防止AI匹配到自己
          jq --arg n "$ISSUE_NUMBER" 'map(select(.number != ($n|tonumber)))' issues.json > filtered_issues.json

      - name: Call DeepSeek AI judge
        id: ai_judge
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ISSUE_TITLE="$TITLE"
          ISSUE_BODY="$BODY"
          ISSUE_NUM="$ISSUE_NUMBER"
          ISSUES_JSON=$(cat filtered_issues.json)

          RESPONSE=$(curl -s -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_KEY" \
            -d '{
              "model": "deepseek-chat",
              "temperature": 0.1,
              "messages": [
                {
                  "role": "system",
                  "content": "你是仓库Issue审核机器人，只输出纯JSON，不许多余解释。规则：1. 标题/正文核心诉求相同，只是措辞、长短、语序不同，一律判定为重复duplicate；2. 乱码、无意义灌水、语句不通的内容判定为reject；3. 正常原创需求判定为normal。重复时必须给出最相似的历史issue编号origin_id；找不到重复，origin_id为空。严禁返回当前待审核issue的编号作为origin_id！输出格式：{\"type\":\"reject|duplicate|normal\",\"origin_id\":数字或空}"
                },
                {
                  "role": "user",
                  "content": "当前Issue编号：'"$ISSUE_NUM"'，标题：'"$ISSUE_TITLE"'，正文：'"$ISSUE_BODY"'，历史Issue列表：'"$ISSUES_JSON"'"
                }
              ]
            }')

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > result.json
          cat result.json

          AI_TYPE=$(jq -r '.type' result.json)
          ORIGIN_ID=$(jq -r '.origin_id' result.json)
          echo "AI_TYPE=$AI_TYPE" >> $GITHUB_ENV
          echo "ORIGIN_ID=$ORIGIN_ID" >> $GITHUB_ENV

      - name: Handle normal issue
        if: env.AI_TYPE == 'normal'
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"labels":["未验证"]}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/labels

      - name: Handle reject issue
        if: env.AI_TYPE == 'reject'
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"labels":["拒绝"]}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/labels

          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/labels/未验证

          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}

          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"body":"⚠️ 您的Issue描述过于简略、无有效内容，已自动关闭，请完善内容后重新提交。"}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/comments

      - name: Handle duplicate issue
        if: env.AI_TYPE == 'duplicate'
        run: |
          ORIGIN=${{ env.ORIGIN_ID }}
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"labels":["重复"]}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/labels

          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/labels/未验证

          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}

          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"🔍 此Issue与#$ORIGIN高度重复，已自动关闭，请前往原Issue跟进。\"}" \
            ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/comments
