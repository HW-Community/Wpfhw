name: Issue‑Close‑Bot
on:
  issues:
    types: [closed]
permissions:
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 获取issue信息
        uses: octokit/request-action@v2.x
        id: issue
        with:
          route: GET /repos/${{github.repository}}/issues/${{github.event.issue.number}}
          token: ${{secrets.GITHUB_TOKEN}}

      - name: 读取关闭原因
        run: echo "REASON=$(echo '${{steps.issue.outputs.data}}' | jq -r '.state_reason')" >> $GITHUB_ENV

      - name: not_planned 覆写标签=拒绝
        if: env.REASON == 'not_planned'
        run: |
          curl -s -X PATCH \
          -H "Authorization: token ${{secrets.GITHUB_TOKEN}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{github.repository}}/issues/${{github.event.issue.number}} \
          -d '{"labels":["拒绝"]}'

      - name: duplicate 覆写标签=重复: (
        if: env.REASON == 'duplicate'
        run: |
          curl -s -X PATCH \
          -H "Authorization: token ${{secrets.GITHUB_TOKEN}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{github.repository}}/issues/${{github.event.issue.number}} \
          -d '{"labels":["重复: ("]}'