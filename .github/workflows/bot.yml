name: Issue‑Close‑Bot
on:
  issues:
    types: [closed]
permissions:
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch issue detail
        uses: octokit/request-action@v2.x
        id: get_issue
        with:
          route: GET /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save close reason
        run: echo "CLOSE_REASON=$(echo '${{ steps.get_issue.outputs.data }}' | jq -r '.state_reason')" >> $GITHUB_ENV

      - name: Set label 拒绝
        if: env.CLOSE_REASON == 'not_planned'
        run: curl -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} -d '{"labels":["拒绝"]}'

      - name: Set label 重复: (
        if: env.CLOSE_REASON == 'duplicate'
        run: curl -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }} -d '{"labels":["重复: ("]}'