name: 新功能需求
description: 提交功能建议、新增特性、优化提议
title: "[Feature] "
labels: [未验证]
type: 新功能
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ 新增功能建议
        请尽可能完整描述你的需求，方便开发者理解并评估

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前自检
    options:
      - label: 我已经检索过Issue，确认没有重复的功能提议
        required: true
      - label: 我只是随便点的，没有认真筛查
        required: false

  - type: input
    id: feature-name
    attributes:
      label: 功能简短概述
      placeholder: 一句话描述想要新增什么功能
    validations:
      required: true

  - type: textarea
    id: use-scene
    attributes:
      label: 使用场景
      description: 在什么情况下你需要该功能
      placeholder: 例：我经常需要批量导出下载记录，目前软件不支持
    validations:
      required: true

  - type: textarea
    id: expect-function
    attributes:
      label: 期待的功能细节
      description: 详细描述功能该如何运作
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 该功能带来的好处
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: 补充说明、参考截图或案例
    validations:
      required: false